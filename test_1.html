<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>

<div style="display:flex; gap:10px;">
  <div id="pano1" style="width:400px;height:300px;"></div>
  <div id="pano2" style="width:400px;height:300px;"></div>
  <div id="pano3" style="width:400px;height:300px;"></div>
  <div id="pano4" style="width:400px;height:300px;"></div>
</div>

<script>
pannellum.viewer('pano1', {
  type: 'equirectangular',
  panorama: 'images/my360photo_1.jpg',
  autoLoad: true
});

pannellum.viewer('pano2', {
  type: 'equirectangular',
  panorama: 'images/my360photo_2.jpg',
  autoLoad: true
});
pannellum.viewer('pano3', {
  type: 'equirectangular',
  panorama: 'images/my360photo_3.jpg',
  autoLoad: true
});
pannellum.viewer('pano4', {
  type: 'equirectangular',
  panorama: 'images/my360photo_4.jpg',
  autoLoad: true
});
</script>
