<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Insta360 Embed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }
    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
    }
    .insta360-frame {
      width: 100%;
      height: 600px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
<link rel="stylesheet" href="https://unpkg.com/pannellum/build/pannellum.css">
<script src="https://unpkg.com/pannellum/build/pannellum.js"></script>

<div id="panorama" style="width: 600px; height: 400px;"></div>
<script>
  pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: '/images/my360photo.jpg'
  });
</script>
  </div>
</body>
</html>
